# Hugo site for GitHub Pages. The Markdown lives in the repo root, shared/
# and pilot/ exactly as on GitHub; this folder only holds the site config.
# Preview locally: cd site && hugo server
baseURL = "https://burmanm.github.io/review-guidelines/"
title = "Review guidelines"
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[module]
[module.hugoVersion]
min = "0.146.0"
extended = true
[[module.imports]]
path = "github.com/imfing/hextra"

# Mount the repo's Markdown as content. READMEs become section landing pages;
# tools/, teams/ and 05-maintenance-agents.md (not ready to publish yet) and
# anything else not listed is never published. Links to them go to GitHub instead.
[[module.mounts]]
source = "../README.md"
target = "content/_index.md"
[[module.mounts]]
source = "../pilot/cass-operator/README.md"
target = "content/pilot/cass-operator/_index.md"
[[module.mounts]]
source = ".."
target = "content"
files = ["! /README.md", "! **/README.md", "! /05-maintenance-agents.md", "/*.md", "/shared/**.md", "/pilot/**.md"]
[[module.mounts]]
source = "layouts"
target = "layouts"

[params]
repoURL = "https://github.com/burmanm/review-guidelines"
description = "A plan for improving code review in a team where more and more code is written by AI agents."
[params.navbar]
displayTitle = true
displayLogo = false
[params.page]
width = "wide"
[params.search]
enable = true
type = "flexsearch"
[params.search.flexsearch]
index = "content"
[params.editURL]
enable = true
base = "https://github.com/burmanm/review-guidelines/edit/main"  # fallback; per-page targets are set below
[params.displayUpdatedDate]
enable = true
[params.footer]
displayPoweredBy = false

[[menu.main]]
name = "Search"
weight = 1
params = { type = "search" }
[[menu.main]]
name = "GitHub"
weight = 2
url = "https://github.com/burmanm/review-guidelines"
params = { icon = "github" }

# Every page uses the docs layout (sidebar + table of contents).
[[cascade]]
  type = "docs"
  [cascade.target]
  path = "{/**}"

[[cascade]]
  editURL = "https://github.com/burmanm/review-guidelines/edit/main/README.md"
  [cascade.target]
  path = "/"

# Sidebar labels, order and "Edit this page" targets live here, so the .md files
# need no front matter. Each page's heading still comes from the file's own "# ..." line.
[[cascade]]
  title = "Plan"
